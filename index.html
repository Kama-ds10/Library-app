<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Classical Library</title>
    <!-- Google Fonts for Editorial Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-wrapper">
      <!-- APP HEADER -->
      <header class="app-header">
        <div class="header-titles">
          <h1>The Library</h1>
          <p class="subtitle">A curated collection of your literary journey</p>
        </div>
        <button id="new-book-btn" class="btn btn-primary">
          <span>+</span> Add New Entry
        </button>
      </header>

      <!-- STATS BAR -->
      <section class="stats-bar">
        <div class="stat-item">Total Books: <span id="stat-total">0</span></div>
        <div class="stat-item">Read: <span id="stat-read">0</span></div>
        <div class="stat-item">Unread: <span id="stat-unread">0</span></div>
      </section>

      <!-- BOOK DISPLAY CONTAINER -->
      <main id="book-container" class="empty-library"></main>
    </div>

    <!-- MODAL DIALOG -->
    <dialog id="book-dialog">
      <form id="book-form" novalidate>
        <div class="form-header">
          <h2>Catalog New Book</h2>
          <p>Enter the details to add this volume to your shelves.</p>
        </div>

        <!-- TITLE -->
        <div class="input-group">
          <label for="title">Book Title</label>
          <input
            type="text"
            id="title"
            name="title"
            placeholder="e.g., The Odyssey"
            required
          />
        </div>

        <!-- AUTHOR -->
        <div class="input-group">
          <label for="author">Author</label>
          <input
            type="text"
            id="author"
            name="author"
            placeholder="e.g., Homer"
            required
          />
        </div>

        <!-- PAGES & STATUS ROW -->
        <div class="form-row">
          <div class="input-group">
            <label for="pages">Page Count</label>
            <input
              type="number"
              id="pages"
              name="pages"
              min="1"
              placeholder="384"
              required
            />
          </div>

          <div class="input-group">
            <label for="status">Reading Status</label>
            <select id="status" name="status">
              <option value="Read">Completed</option>
              <option value="Not Read">Plan to Read</option>
            </select>
          </div>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="form-buttons">
          <button type="button" id="close-dialog" class="btn btn-secondary">
            Cancel
          </button>
          <button type="submit" class="btn btn-primary">Catalog Book</button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
