<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library App</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- APP HEADER -->
    <header>
        <h1>My Library</h1>

        <button id="new-book-btn" class="btn">
            Add New Book
        </button>
    </header>

    <!-- BOOK DISPLAY CONTAINER -->
    <main id="book-container"></main>

    <!-- MODAL -->
    <dialog id="book-dialog">

        <!-- REMOVE method="dialog" -->
        <form id="book-form">

            <h2>Add New Book</h2>

            <!-- TITLE -->
            <label for="title">Title</label>
            <input
                type="text"
                id="title"
                name="title"
                required
            >

            <!-- AUTHOR -->
            <label for="author">Author</label>
            <input
                type="text"
                id="author"
                name="author"
                required
            >

            <!-- PAGES -->
            <label for="pages">Pages</label>
            <input
                type="number"
                id="pages"
                name="pages"
                min="1"
                required
            >

            <!-- STATUS -->
            <label for="status">Status</label>
            <select id="status">

                <option value="Read">
                    Read
                </option>

                <option value="Not Read">
                    Not Read
                </option>

            </select>

            <!-- BUTTONS -->
            <div class="form-buttons">

                <button type="submit" class="btn">
                    Add Book
                </button>

                <button
                    type="button"
                    id="close-dialog"
                    class="btn cancel-btn"
                >
                    Cancel
                </button>

            </div>

        </form>

    </dialog>

    <script src="app.js"></script>

</body>
</html>
